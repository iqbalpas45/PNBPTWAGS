                if (data.error) {

                    body: JSON.stringify(data),
                    redirect: 'follow'
                });
                const result = await response.json();
                return result.success === true;
            } catch (error) {

        function isHolidayOrWeekend(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            const dayOfWeek = date.getDay();
            const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
            const isPublicHoliday = publicHolidays2026.includes(dateStr);
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const isCustomHoliday = store.customHolidays.some(h => h.bulan === month && h.tanggal === day);
            return isWeekend || isPublicHoliday || isCustomHoliday;
        }

        function getDayName(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleString('id-ID', { weekday: 'long' });
        }

        function formatCurrency(num) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
        }

        function formatNominal(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '');
        }

        function getTarifForDate(tanggal) {
            const isHoliday = isHolidayOrWeekend(tanggal);
            return {
                nusantara: isHoliday ? tarif.nusantaraLibur : tarif.nusantaraKerja,
                asing: isHoliday ? tarif.asingLibur : tarif.asingKerja,
                isHoliday: isHoliday,
                type: isHoliday ? 'LIBUR' : 'KERJA'
            };
        }

        function calculateRevenue(trans) {
            const tarifData = getTarifForDate(trans.tanggal);
            return (trans.nusantara * tarifData.nusantara.harga) + (trans.asing * tarifData.asing.harga);
        }

        function calculateVisitors(trans) {
            return trans.nusantara + trans.asing;
        }

                                        <tr class="border-t border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700">
                                            <td class="px-4 py-2 md:py-3 text-gray-900 dark:text-white">${bulanNames[h.bulan]}</td>
                                            <td class="px-4 py-2 md:py-3 text-gray-900 dark:text-white">${h.tanggal}</td>
                                            <td class="px-4 py-2 md:py-3 text-gray-900 dark:text-white">${h.nama}</td>
                                            <td class="px-4 py-2 md:py-3 text-center">
                                                <button onclick="deleteHoliday(${idx})" class="px-2 md:px-3 py-1 md:py-2 bg-danger hover:bg-red-600 text-white rounded text-xs font-semibold transition-colors min-h-[32px] md:min-h-[36px]">
                                                    🗑️
                                                </button>
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                    ${store.customHolidays.length === 0 ? '<p class="text-gray-500 dark:text-gray-400 text-sm mt-3">Belum ada hari libur custom</p>' : ''}
                </div>
            `;
        }

        // Main render function
        function render() {
            renderSidebar();
            const app = document.getElementById('app');
            let content = '';

            switch(store.currentTab) {
                case 'dashboard':
                    content = renderDashboard();
                    break;
                case 'input':
                    content = renderInputHarian();
                    break;
                case 'rekaptunai':
                    content = renderRekapTunai();
                    break;
                case 'split':
                    content = renderSplitTransfer();
                    break;
                case 'laporan':
                    content = renderLaporanBulanan();
                    break;
                case 'settings':
                    content = renderSettings();
                    break;
            }

            app.innerHTML = content;
            attachEventListeners();
        }

        let sidebarCollapsed = false;
        let mobileMenuOpen = false;

        function toggleSidebar() {
            sidebarCollapsed = !sidebarCollapsed;
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            const brand = document.getElementById('sidebar-brand');
            const toggleIcon = document.getElementById('toggle-icon');

            if (sidebarCollapsed) {
                sidebar.classList.remove('md:w-64');
                sidebar.classList.add('md:w-20');
                mainContent.classList.remove('md:ml-64');
                mainContent.classList.add('md:ml-20');
                brand.classList.add('hidden');
                toggleIcon.classList.remove('fa-chevron-left');
                toggleIcon.classList.add('fa-chevron-right');
            } else {
                sidebar.classList.add('md:w-64');
                sidebar.classList.remove('md:w-20');
                mainContent.classList.add('md:ml-64');
                mainContent.classList.remove('md:ml-20');
                brand.classList.remove('hidden');
                toggleIcon.classList.add('fa-chevron-left');
                toggleIcon.classList.remove('fa-chevron-right');
            }
        }

        function toggleMobileSidebar() {
            mobileMenuOpen = !mobileMenuOpen;
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const hamburgerIcon = document.getElementById('hamburger-icon');

            if (mobileMenuOpen) {
                sidebar.classList.remove('-translate-x-full');
                sidebar.classList.add('translate-x-0');
                overlay.classList.remove('hidden');
                hamburgerIcon.classList.remove('fa-bars');
                hamburgerIcon.classList.add('fa-times');
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebar.classList.remove('translate-x-0');
                overlay.classList.add('hidden');
                hamburgerIcon.classList.add('fa-bars');
                hamburgerIcon.classList.remove('fa-times');
            }
        }

        // Close mobile sidebar when a nav item is clicked
        window.addEventListener('click', function(e) {
            const sidebar = document.getElementById('sidebar');
            const hamburgerBtn = document.getElementById('hamburger-btn');

            if (mobileMenuOpen && !sidebar.contains(e.target) && !hamburgerBtn.contains(e.target)) {
                toggleMobileSidebar();
            }
        });

        function renderSidebar() {
            const tabs = [
                { id: 'dashboard', icon: 'fa-home', label: 'Dashboard' },
                { id: 'input', icon: 'fa-pen', label: 'Input Harian' },
                { id: 'rekaptunai', icon: 'fa-list', label: 'Rekap Tunai' },
                { id: 'split', icon: 'fa-share', label: 'Split Transfer' },
                { id: 'laporan', icon: 'fa-chart-line', label: 'Laporan Bulanan' },
                { id: 'settings', icon: 'fa-gear', label: 'Pengaturan' }
            ];

            const sidebarNav = document.getElementById('sidebar-nav');
            sidebarNav.innerHTML = tabs.map(tab => `
                <button onclick="store.currentTab='${tab.id}'; render()" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-white ${store.currentTab === tab.id ? 'active' : ''}" title="${tab.label}">
                    <i class="fas ${tab.icon} w-5 flex-shrink-0"></i>
                    <span class="label-text">${tab.label}</span>
                </button>
            `).join('');
        }

        function updateTarifInfo() {
            const inputTanggal = document.getElementById('inputTanggal');
            const tarifDisplay = document.getElementById('tarifDisplay');

            if (!inputTanggal.value) {
                tarifDisplay.innerHTML = '<span class="text-gray-600">Pilih tanggal terlebih dahulu</span>';
                return;
            }

            const tarifData = getTarifForDate(inputTanggal.value);
            const hari = getDayName(inputTanggal.value);
            const jenisTarif = tarifData.isHoliday ? '<span class="font-bold text-red-600">HARI LIBUR</span>' : '<span class="font-bold text-green-600">HARI KERJA</span>';

            tarifDisplay.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div><strong>${hari}</strong> - ${jenisTarif}</div>
                    <div class="space-y-1 text-xs">
                        <div>Nusantara: <strong>${formatCurrency(tarifData.nusantara.harga)}</strong></div>
                        <div>Asing: <strong>${formatCurrency(tarifData.asing.harga)}</strong></div>
                    </div>
                </div>
            `;
        }

        function updateTotalDisplay() {
            const nusantaraCash = parseInt(document.getElementById('nusantaraCash').value) || 0;
            const nusantaraQris = parseInt(document.getElementById('nusantaraQris').value) || 0;
            const nusantaraVa = parseInt(document.getElementById('nusantaraVa').value) || 0;
            const asingCash = parseInt(document.getElementById('asingCash').value) || 0;
            const asingQris = parseInt(document.getElementById('asingQris').value) || 0;
            const asingVa = parseInt(document.getElementById('asingVa').value) || 0;

            const nusantaraTotal = nusantaraCash + nusantaraQris + nusantaraVa;
            const asingTotal = asingCash + asingQris + asingVa;

            document.getElementById('nusantaraTotalDisplay').textContent = nusantaraTotal;
            document.getElementById('asingTotalDisplay').textContent = asingTotal;
        }

        function attachEventListeners() {
            const formTransaksi = document.getElementById('formTransaksi');
            if (formTransaksi) {
                formTransaksi.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const tanggal = document.getElementById('inputTanggal').value;
                    const loket = parseInt(document.getElementById('inputLoket').value);
                    const nusantaraCash = parseInt(document.getElementById('nusantaraCash').value) || 0;
                    const nusantaraQris = parseInt(document.getElementById('nusantaraQris').value) || 0;
                    const nusantaraVa = parseInt(document.getElementById('nusantaraVa').value) || 0;
                    const asingCash = parseInt(document.getElementById('asingCash').value) || 0;
                    const asingQris = parseInt(document.getElementById('asingQris').value) || 0;
                    const asingVa = parseInt(document.getElementById('asingVa').value) || 0;

                    const nusantara = nusantaraCash + nusantaraQris + nusantaraVa;
                    const asing = asingCash + asingQris + asingVa;

                    if (nusantara + asing === 0) {
                        showToast('⚠️ Minimal ada 1 tiket yang terjual!');
                        return;
                    }

                    const trans = {
                        id: store.transaksiHarian.length + 1,
                        tanggal, loket, nusantara, asing,
                        nusantaraCash, nusantaraQris, nusantaraVa,
                        asingCash, asingQris, asingVa
                    };

                    // Simpan ke Supabase
                    const supabaseSuccess = await saveToSupabase(trans);
                    if (supabaseSuccess) {
                        store.transaksiHarian.push(trans);
                        showToast('✅ Transaksi tersimpan ke Supabase!');
                    } else {
                        // Fallback: simpan ke local jika Supabase gagal
                        store.transaksiHarian.push(trans);
                        showToast('⚠️ Disimpan ke local (Supabase offline)');
                    }

                    formTransaksi.reset();
                    document.getElementById('tarifDisplay').innerHTML = '<span class="text-gray-600">Pilih tanggal terlebih dahulu</span>';
                    document.getElementById('nusantaraTotalDisplay').textContent = '0';
                    document.getElementById('asingTotalDisplay').textContent = '0';
                    render();
                });
            }

            const formBA = document.getElementById('formBA');
            if (formBA) {
                formBA.addEventListener('submit', (e) => {
                    e.preventDefault();
                    showToast('✅ Berita Acara tersimpan!');
                    formBA.reset();
                });
            }

            const formOpname = document.getElementById('formOpname');
            if (formOpname) {
                formOpname.addEventListener('submit', (e) => {
                    e.preventDefault();
                    showToast('✅ Opname stok tersimpan!');
                    formOpname.reset();
                });
            }

            const formAddHoliday = document.getElementById('formAddHoliday');
            if (formAddHoliday) {
                formAddHoliday.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const bulan = parseInt(document.getElementById('holidayMonth').value);
                    const tanggal = parseInt(document.getElementById('holidayDate').value);
                    const nama = document.getElementById('holidayName').value;

                    if (!bulan || !tanggal || !nama) {
                        showToast('⚠️ Semua field harus diisi!');
                        return;
                    }

                    if (tanggal < 1 || tanggal > 31) {
                        showToast('⚠️ Tanggal harus antara 1-31!');
                        return;
                    }

                    const exists = store.customHolidays.some(h => h.bulan === bulan && h.tanggal === tanggal);
                    if (exists) {
                        showToast('⚠️ Hari libur sudah ada!');
                        return;
                    }

                    const success = await postToGAS('addCustomHoliday', { bulan, tanggal, nama });

                    if (success) {
                        store.customHolidays.push({ bulan, tanggal, nama });
                        showToast(`✅ Hari libur "${nama}" ditambahkan!`);
                        formAddHoliday.reset();
                        render();
                    } else {
                        showToast('❌ Gagal menambahkan hari libur!');
                    }
                });
            }
        }

        function editTransaksi(index) {
            const t = store.transaksiHarian[index];
            const newNusantara = prompt('Jumlah Nusantara:', t.nusantara);
            if (newNusantara === null) return;

            const newAsing = prompt('Jumlah Asing:', t.asing);
            if (newAsing === null) return;

            const newLoket = prompt('Loket (1/2):', t.loket);
            if (newLoket === null) return;

            store.transaksiHarian[index] = {
                ...t,
                nusantara: parseInt(newNusantara),
                asing: parseInt(newAsing),
                loket: parseInt(newLoket)
            };

            showToast('✅ Transaksi diperbarui!');
            render();
        }

        function deleteTransaksi(index) {
            const t = store.transaksiHarian[index];
            if (confirm(`Hapus transaksi ${t.tanggal} - Loket ${t.loket}?`)) {
                store.transaksiHarian.splice(index, 1);
                showToast('✅ Transaksi dihapus!');
                render();
            }
        }

        function deleteHoliday(index) {
            const h = store.customHolidays[index];
            if (confirm(`Hapus hari libur "${h.nama}"?`)) {
                store.customHolidays.splice(index, 1);
                showToast('✅ Hari libur dihapus!');
                render();
            }
        }

        // ============================================
        // LOGIN FUNCTIONS
        // ============================================
        const VALID_USERNAME = 'firesky';

        function checkLoginStatus() {
            const isLoggedIn = sessionStorage.getItem('isLoggedIn');
            const loginModal = document.getElementById('loginModal');
            const appContainer = document.getElementById('appContainer');

            if (isLoggedIn === 'true') {
                loginModal.classList.add('hidden');
                appContainer.classList.remove('hidden');
                return true;
            } else {
                loginModal.classList.remove('hidden');
                appContainer.classList.add('hidden');
                return false;
            }
        }

        function handleLoginSubmit(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('usernameInput');
            const username = usernameInput.value.trim();

            if (!username) {
                showToast('❌ Username tidak boleh kosong!');
                return;
            }

            if (username !== VALID_USERNAME) {
                showToast('❌ Username salah!');
                usernameInput.value = '';
                usernameInput.focus();
                return;
            }

            // Login berhasil
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('username', username);
            showToast(`✅ Selamat datang, ${username}!`);

            setTimeout(async () => {
                document.getElementById('loginForm').reset();
                checkLoginStatus();
                // Initialize data BEFORE render
                await initializeData();
                await loadSupabaseData();
                render();
            }, 500);
        }

        function logout() {
            if (confirm('Apakah Anda yakin ingin keluar?')) {
                sessionStorage.removeItem('isLoggedIn');
                sessionStorage.removeItem('username');
                showToast('✅ Anda telah keluar!');

                setTimeout(() => {
                    checkLoginStatus();
                    document.getElementById('usernameInput').focus();
                }, 500);
            }
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', async () => {
            checkLoginStatus();
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                render();
                // Try Supabase first, fallback to dummyTransaksi
                await loadSupabaseData();
                initializeData();
            }
        });
    </script>
</body>
</html>
